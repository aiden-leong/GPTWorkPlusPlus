name: Release assets

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  web-manager-bundle:
    name: Web manager bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        working-directory: apps/codex-plus-manager
        run: npm install --package-lock=false

      - name: Build frontend
        working-directory: apps/codex-plus-manager
        run: npm run vite:build

      - name: Install server dependencies
        working-directory: apps/codex-plus-manager/server
        run: npm install --package-lock=false

      - name: Package tarball
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          version="${version#V}"
          stage="dist/codex-plus-manager-${version}"
          rm -rf dist
          mkdir -p "${stage}"
          # frontend bundle
          cp -R apps/codex-plus-manager/dist "${stage}/dist"
          # node server (with its node_modules)
          cp -R apps/codex-plus-manager/server "${stage}/server"
          # launchers
          mkdir -p "${stage}/bin"
          cat > "${stage}/bin/start.sh" <<'SH'
          #!/usr/bin/env bash
          set -e
          cd "$(dirname "$0")/.."
          exec node server/index.js "$@"
          SH
          cat > "${stage}/bin/start.bat" <<'BAT'
          @echo off
          cd /d "%~dp0\.."
          node server\index.js %*
          BAT
          chmod +x "${stage}/bin/start.sh"
          cat > "${stage}/README.txt" <<'TXT'
          Codex++ Web Manager
          ===================

          Quick start:
            ./bin/start.sh     # macOS / Linux
            bin\start.bat      # Windows

          Then open http://127.0.0.1:18794 in your browser.
          The Vite dev server is not required for the built bundle.

          Custom port:  PORT=3000 ./bin/start.sh
          Custom CORS:  ALLOWED_ORIGIN=http://localhost:3000 ./bin/start.sh
          TXT
          tar -C dist -czf "dist/codex-plus-manager-${version}.tar.gz" "codex-plus-manager-${version}"
          echo "built dist/codex-plus-manager-${version}.tar.gz"
          ls -lh dist/

      - name: Upload tarball
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: dist/*.tar.gz

  latest-json:
    name: Upload static latest.json
    runs-on: ubuntu-latest
    needs:
      - web-manager-bundle
    steps:
      - name: Generate latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$REPO" --json assets,body,tagName,url > release.json
          node <<'NODE'
          const fs = require("fs");
          const release = JSON.parse(fs.readFileSync("release.json", "utf8"));
          const repo = process.env.REPO;
          const tag = release.tagName || process.env.TAG;
          const version = tag.replace(/^v/i, "");
          const baseUrl = `https://github.com/${repo}/releases/download/${tag}`;
          const assets = (release.assets || [])
            .map((asset) => asset.name)
            .filter((name) => name !== "latest.json")
            .map((name) => ({ name, url: `${baseUrl}/${encodeURIComponent(name)}` }));
          const payload = {
            version: `v${version}`,
            url: release.url || `https://github.com/${repo}/releases/tag/${tag}`,
            body: release.body || "",
            assets
          };
          fs.writeFileSync("latest.json", `${JSON.stringify(payload, null, 2)}\n`);
          NODE
          cat latest.json

      - name: Upload latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        shell: bash
        run: gh release upload "$TAG" latest.json --clobber --repo "$REPO"
