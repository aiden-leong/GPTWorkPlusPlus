name: PR build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-frontend:
    name: Build Vite frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        working-directory: apps/codex-plus-manager
        run: npm install --package-lock=false

      - name: TypeScript check
        working-directory: apps/codex-plus-manager
        run: npm run check

      - name: Build frontend
        working-directory: apps/codex-plus-manager
        run: npm run vite:build

      - name: Upload frontend bundle
        uses: actions/upload-artifact@v4
        with:
          name: codex-plus-manager-frontend
          path: apps/codex-plus-manager/dist/*
          if-no-files-found: error

  smoke-server:
    name: Node server smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install server dependencies
        working-directory: apps/codex-plus-manager/server
        run: npm install --package-lock=false

      - name: Run minimal smoke test
        working-directory: apps/codex-plus-manager/server
        run: node smoke-minimal.js
