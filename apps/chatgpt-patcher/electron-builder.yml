# electron-builder 配置
#
# Patcher.app: 拖入 .app → 输出 patch 后的 ChatGPT++.app
# Patcher.app 自带:
#   - 拖拽 UI (patcher.html/css/js)
#   - inject/ (hook.js + admin-ui/) — patch 时拷到 ChatGPT++.app
#
# 用法:
#   npm run build:patcher
# 产物在 release/

appId: com.aibsd.chatgpt.patcher
productName: ChatGPT Patcher

asar: true

# 打进 Patcher.app 的文件
files:
  - electron/patcher-main.cjs
  - electron/patcher-preload.js
  - patcher.html
  - patcher.css
  - patcher.js
  - package.json

# inject/ 嵌到 Resources/patcher-resources/
extraResources:
  - from: inject
    to: patcher-resources
    filter:
      - "**/*"

extraMetadata:
  main: electron/patcher-main.cjs

directories:
  output: release
  buildResources: build-resources

mac:
  category: public.app-category.developer-tools
  icon: build-resources/icon.icns
  # Patcher.app 本身不需要严格签名 (开发用)
  hardenedRuntime: false
  gatekeeperAssess: false
  identity: null
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64

