# electron-builder 配置
# 用法:
#   npm run electron:build       # 出 dmg + zip (x64 + arm64)
#   npm run electron:build:dir   # 只出 .app bundle (快速验证)
# 产物在 release/

appId: com.aibsd.codexplusplus.manager
productName: Codex++ Manager

asar: true

# 打进 asar 的文件：前端 dist/ + electron 入口 + package.json
files:
  - electron/**/*
  - dist/**/*
  - package.json

# 不进 asar 但要随 .app 走的：server/ 整个目录（含 node_modules）
extraResources:
  - from: server
    to: server
    filter:
      - "**/*"
      - "!node_modules/.cache/**"
      - "!**/*.map"

directories:
  output: release
  buildResources: electron

mac:
  category: public.app-category.developer-tools
  icon: electron/icon.icns
  # 不签名 — 本地双击用 (用户首次启动需右键打开绕过 Gatekeeper)
  hardenedRuntime: false
  gatekeeperAssess: false
  identity: null
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
